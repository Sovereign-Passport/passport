<script type="module">

// ─────────────────────────────────────────────────────────────────────────────
// CRYPTO UTILITIES — inlined
// ─────────────────────────────────────────────────────────────────────────────

const toB64   = b => btoa(String.fromCharCode(...new Uint8Array(b)))
  .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')
const fromB64 = s => {
  const p=s.replace(/-/g,'+').replace(/_/g,'/')
    .padEnd(s.length+(4-s.length%4)%4,'=')
  return Uint8Array.from(atob(p),c=>c.charCodeAt(0))
}
const encJSON = o => toB64(new TextEncoder().encode(JSON.stringify(o)))
const decJSON = s => JSON.parse(new TextDecoder().decode(fromB64(s)))
const _now    = () => new Date().toISOString()
const _uuid   = () => crypto.randomUUID()

async function sha256(str) {
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str))
  return toB64(buf)
}
async function edSign(pk,data) {
  const buf=await crypto.subtle.sign('Ed25519',pk,new TextEncoder().encode(data))
  return toB64(buf)
}
async function edVerify(pk,data,sig) {
  return crypto.subtle.verify('Ed25519',pk,fromB64(sig),new TextEncoder().encode(data))
}
async function importPub(jwk) {
  return crypto.subtle.importKey('jwk',jwk,{name:'Ed25519'},true,['verify'])
}
async function importPriv(jwk) {
  return crypto.subtle.importKey('jwk',jwk,{name:'Ed25519'},true,['sign'])
}
async function generateKeypair() {
  return crypto.subtle.generateKey({name:'Ed25519'},true,['sign','verify'])
}
async function exportJwk(key) { return crypto.subtle.exportKey('jwk',key) }

const CREDENTIAL_TYPE = {
  MEMBERSHIP:'MembershipCredential', REFERRAL:'ReferralCredential',
  ISSUER:'IssuerCredential', ROLE:'RoleCredential',
}


// ─────────────────────────────────────────────────────────────────────────────
// CREDENTIALS.JS — inlined
// ─────────────────────────────────────────────────────────────────────────────

async function createDisclosure(key,value) {
  const salt=toB64(crypto.getRandomValues(new Uint8Array(16)))
  const array=[salt,key,value]
  const disclosure=toB64(new TextEncoder().encode(JSON.stringify(array)))
  const hash=await sha256(disclosure)
  return {disclosure,hash,key,value,salt}
}

async function verifyDisclosure(disclosure,hash) {
  const computed=await sha256(disclosure)
  if(computed!==hash) return {valid:false,key:null,value:null}
  const [salt,key,value]=JSON.parse(new TextDecoder().decode(fromB64(disclosure)))
  return {valid:true,key,value}
}

async function buildCredential({issuerDid,subjectDid,type,boundClaims,selectiveClaims,expiresAt}) {
  const disclosures=[],sdHashes=[]
  for(const [key,value] of Object.entries(selectiveClaims??{})){
    const d=await createDisclosure(key,value)
    disclosures.push(d); sdHashes.push(d.hash)
  }
  const issuedAt=_now()
  const header={alg:'EdDSA',typ:'sd-jwt'}
  const payload={
    jti:_uuid(),iss:issuerDid,sub:subjectDid,
    iat:issuedAt,exp:expiresAt??null,type,
    _sd:sdHashes,_sd_alg:'sha-256',...boundClaims,
  }
  return {header,payload,disclosures,sdHashes}
}

function extractBoundClaims(payload) {
  const reserved=new Set(['jti','iss','sub','iat','exp','type','_sd','_sd_alg'])
  return Object.fromEntries(Object.entries(payload).filter(([k])=>!reserved.has(k)))
}

async function issueCredential(credPayload,issuerPrivKey) {
  const {header,payload,disclosures}=credPayload
  const hB64=encJSON(header),pB64=encJSON(payload)
  const sig=await edSign(issuerPrivKey,`${hB64}.${pB64}`)
  const sdJwt=[`${hB64}.${pB64}.${sig}`,...disclosures.map(d=>d.disclosure)].join('~')
  return {
    id:payload.jti,type:payload.type,
    issuer_did:payload.iss,subject_did:payload.sub,
    issued_at:payload.iat,expires_at:payload.exp,
    bound_claims:extractBoundClaims(payload),
    sd_jwt:sdJwt,disclosures,revoked:false,
  }
}

function parseCredential(sdJwt) {
  const parts=sdJwt.split('~')
  const [hB64,pB64,signature]=parts[0].split('.')
  const header=decJSON(hB64),payload=decJSON(pB64)
  const disclosures=parts.slice(1).filter(Boolean).map(d=>{
    try{
      const [salt,key,value]=JSON.parse(new TextDecoder().decode(fromB64(d)))
      return {disclosure:d,salt,key,value}
    }catch{ return {disclosure:d,salt:null,key:null,value:null,malformed:true} }
  })
  return {
    raw:sdJwt,headerB64:hB64,payloadB64:pB64,signature,
    header,payload,disclosures,
    id:payload.jti,type:payload.type,
    issuer_did:payload.iss,subject_did:payload.sub,
    issued_at:payload.iat,expires_at:payload.exp,
    sd_hashes:payload._sd??[],
    bound_claims:extractBoundClaims(payload),
  }
}

async function verifyCredential(parsed,issuerKey) {
  try{
    const pk=issuerKey instanceof CryptoKey?issuerKey:await importPub(issuerKey)
    const valid=await edVerify(pk,`${parsed.headerB64}.${parsed.payloadB64}`,parsed.signature)
    if(!valid) return {valid:false,reason:'SIGNATURE_INVALID'}
    for(const d of parsed.disclosures){
      if(d.malformed) return {valid:false,reason:'MALFORMED_DISCLOSURE'}
      const computed=await sha256(d.disclosure)
      if(!parsed.sd_hashes.includes(computed)) return {valid:false,reason:'DISCLOSURE_HASH_MISMATCH'}
    }
    return {valid:true,reason:null}
  }catch(e){ return {valid:false,reason:`VERIFICATION_ERROR: ${e.message}`} }
}

async function buildPresentation({credential,revealKeys,holderDid,holderPrivateKey,verifierDid,nonce}) {
  const chosen=(credential.disclosures??[]).filter(d=>revealKeys.includes(d.key))
  const [jwtPart]=credential.sd_jwt.split('~')
  const presentedSdJwt=[jwtPart,...chosen.map(d=>d.disclosure)].join('~')
  const proofPayload={iss:holderDid,aud:verifierDid??null,nonce:nonce??null,iat:_now(),vp:presentedSdJwt}
  const proofB64=encJSON(proofPayload)
  const proofSig=await edSign(holderPrivateKey,proofB64)
  return {
    id:_uuid(),type:'VerifiablePresentation',
    holder_did:holderDid,credential_id:credential.id,
    credential_type:credential.type,presented_at:_now(),
    verifier_did:verifierDid??null,nonce:nonce??null,
    sd_jwt:presentedSdJwt,
    holder_proof:{payload:proofPayload,payload_b64:proofB64,signature:proofSig},
    revealed_claims:chosen.map(d=>({key:d.key,value:d.value})),
  }
}

async function verifyPresentation({presentation,issuerPublicKey,holderPublicKey,expectedNonce,expectedVerifierDid}) {
  const result={
    valid:false,issuerValid:false,holderValid:false,
    disclosuresValid:false,nonceValid:false,
    expiryValid:false,subjectMatch:false,
    reason:null,revealedClaims:{},
  }
  try{
    const parsed=parseCredential(presentation.sd_jwt)
    const ic=await verifyCredential(parsed,issuerPublicKey)
    result.issuerValid=ic.valid
    if(!ic.valid){result.reason=`ISSUER_${ic.reason}`;return result}

    result.disclosuresValid=true
    const rc={}
    for(const d of parsed.disclosures){
      const check=await verifyDisclosure(d.disclosure,await sha256(d.disclosure))
      if(!check.valid){result.disclosuresValid=false;result.reason='DISCLOSURE_INVALID';return result}
      rc[d.key]=d.value
    }
    result.revealedClaims=rc

    const hpk=holderPublicKey instanceof CryptoKey?holderPublicKey:await importPub(holderPublicKey)
    const pv=await edVerify(hpk,presentation.holder_proof.payload_b64,presentation.holder_proof.signature)
    result.holderValid=pv
    if(!pv){result.reason='HOLDER_PROOF_INVALID';return result}

    if(expectedNonce){
      result.nonceValid=presentation.holder_proof.payload.nonce===expectedNonce
      if(!result.nonceValid){result.reason='NONCE_MISMATCH';return result}
    } else { result.nonceValid=true }

    if(parsed.payload.exp){
      result.expiryValid=new Date(parsed.payload.exp)>new Date()
      if(!result.expiryValid){result.reason='CREDENTIAL_EXPIRED';return result}
    } else { result.expiryValid=true }

    result.subjectMatch=parsed.subject_did===presentation.holder_did
    if(!result.subjectMatch){result.reason='SUBJECT_MISMATCH';return result}

    result.valid=true; result.reason=null
    return result
  }catch(e){result.reason=`VERIFICATION_ERROR: ${e.message}`;return result}
}

function isCredentialValid(c) {
  if(c.revoked) return {valid:false,reason:'REVOKED'}
  if(c.expires_at&&new Date(c.expires_at)<=new Date()) return {valid:false,reason:'EXPIRED'}
  return {valid:true,reason:null}
}
function revokeCredential(c){ return {...c,revoked:true,revoked_at:_now()} }
function getCredentials(vault,type){ const cs=vault.credentials??[]; return type?cs.filter(c=>c.type===type):[...cs] }
function getCredentialById(vault,id){ return (vault.credentials??[]).find(c=>c.id===id)??null }
function getValidCredentials(vault){ return (vault.credentials??[]).filter(c=>isCredentialValid(c).valid) }
function resolveDisclosureRequest(vault,request) {
  const matching=getValidCredentials(vault).filter(c=>c.type===request.type)
  if(!matching.length) return {credential:null,canSatisfy:false,available:[]}
  const credential=matching.sort((a,b)=>new Date(b.issued_at)-new Date(a.issued_at))[0]
  const available=[...Object.keys(credential.bound_claims??{}),...(credential.disclosures??[]).map(d=>d.key)]
  const canSatisfy=(request.requiredClaims??[]).every(k=>available.includes(k))
  return {credential,canSatisfy,available}
}


// ─────────────────────────────────────────────────────────────────────────────
// TEST HELPERS
// ─────────────────────────────────────────────────────────────────────────────

// Issue a standard membership credential for testing
async function issueMembership(issuerKp, subjectDid, options={}) {
  const issuerPubJwk = await exportJwk(issuerKp.publicKey)
  const cp = await buildCredential({
    issuerDid:      'did:web:la-maison.org',
    subjectDid,
    type:           CREDENTIAL_TYPE.MEMBERSHIP,
    boundClaims:    { node_id:'node-1', memberOf:'La Maison du Soleil Levant' },
    selectiveClaims:{ name:'Eva Martin', email:'eva@maison.org', role:'founder', ...options.selective },
    expiresAt:      options.expiresAt ?? null,
  })
  const cred = await issueCredential(cp, issuerKp.privateKey)
  return { cred, issuerPubJwk }
}


// ─────────────────────────────────────────────────────────────────────────────
// TEST RUNNER
// ─────────────────────────────────────────────────────────────────────────────

const out=document.getElementById('output')
const summary=document.getElementById('summary')
let passed=0,failed=0

function log(msg,cls=''){
  const s=document.createElement('span')
  if(cls) s.className=cls
  s.textContent=msg+'\n'; out.appendChild(s); out.scrollTop=out.scrollHeight
}
async function test(name,fn){
  try{await fn();log(`✅  ${name}`,'pass');passed++}
  catch(e){log(`❌  ${name}`,'fail');log(`    └─ ${e.message}`,'fail');failed++}
}
function assert(c,m){if(!c)throw new Error(m??'Assertion failed')}
function assertEqual(a,b,m){if(a!==b)throw new Error(m??`Expected "${b}", got "${a}"`)}
function assertNull(v,m){if(v!==null&&v!==undefined)throw new Error(m??`Expected null`)}


window.runTests = async function() {
  out.innerHTML=''; summary.style.display='none'; passed=0; failed=0
  log('🎫 PASSPORT — credentials.js test suite\n','head')

  // Shared keypairs for all tests
  const issuerKp  = await generateKeypair()
  const holderKp  = await generateKeypair()
  const rogueKp   = await generateKeypair()
  const holderDid = 'did:key:zEva'
  const holderPubJwk = await exportJwk(holderKp.publicKey)

  // ── 1. Disclosure mechanism ──────────────────────────────────────────────
  log('── Disclosure mechanism ─────────────────','sep')

  await test('createDisclosure — produces hash + disclosure', async () => {
    const d=await createDisclosure('name','Eva Martin')
    assert(typeof d.disclosure==='string','disclosure must be string')
    assert(typeof d.hash==='string','hash must be string')
    assertEqual(d.key,'name','key must match')
    assertEqual(d.value,'Eva Martin','value must match')
    assert(d.salt.length>0,'salt must be non-empty')
  })

  await test('verifyDisclosure — valid disclosure verifies', async () => {
    const d=await createDisclosure('email','eva@maison.org')
    const result=await verifyDisclosure(d.disclosure,d.hash)
    assert(result.valid,'Valid disclosure must verify')
    assertEqual(result.key,'email','key must match')
    assertEqual(result.value,'eva@maison.org','value must match')
  })

  await test('verifyDisclosure — wrong hash fails', async () => {
    const d=await createDisclosure('name','Eva')
    const bad=await sha256('not-the-right-input')
    const result=await verifyDisclosure(d.disclosure,bad)
    assert(!result.valid,'Wrong hash must fail')
  })

  await test('Two disclosures of same key have different hashes (salt)', async () => {
    const d1=await createDisclosure('name','Eva')
    const d2=await createDisclosure('name','Eva')
    assert(d1.hash!==d2.hash,'Different salts must produce different hashes')
    assert(d1.disclosure!==d2.disclosure,'Different salts must produce different disclosures')
  })

  // ── 2. Build credential ──────────────────────────────────────────────────
  log('\n── Build credential ─────────────────────','sep')

  await test('buildCredential — separates bound and selective claims', async () => {
    const cp=await buildCredential({
      issuerDid:'did:web:la-maison.org',subjectDid:holderDid,
      type:CREDENTIAL_TYPE.MEMBERSHIP,
      boundClaims:{node_id:'node-1',memberOf:'La Maison'},
      selectiveClaims:{name:'Eva',email:'eva@maison.org'},
    })
    assertEqual(cp.disclosures.length,2,'Must have 2 disclosures')
    assertEqual(cp.sdHashes.length,2,'Must have 2 sd hashes')
    assert(cp.payload._sd.length===2,'Payload must embed 2 hashes')
    assert(!JSON.stringify(cp.payload).includes('Eva Martin'),'Plaintext name must not appear in payload')
    assert(!JSON.stringify(cp.payload).includes('eva@maison.org'),'Plaintext email must not appear in payload')
    assert(cp.payload.node_id==='node-1','Bound claims must appear in payload')
  })

  await test('buildCredential — no selective claims produces empty _sd', async () => {
    const cp=await buildCredential({
      issuerDid:'did:web:issuer.org',subjectDid:holderDid,
      type:CREDENTIAL_TYPE.MEMBERSHIP,
      boundClaims:{node_id:'node-1'},
      selectiveClaims:{},
    })
    assertEqual(cp.payload._sd.length,0,'No selective claims = empty _sd')
    assertEqual(cp.disclosures.length,0,'No disclosures expected')
  })

  // ── 3. Issue credential ──────────────────────────────────────────────────
  log('\n── Issue credential ─────────────────────','sep')

  await test('issueCredential — produces SD-JWT string', async () => {
    const {cred}=await issueMembership(issuerKp,holderDid)
    assert(typeof cred.sd_jwt==='string','sd_jwt must be a string')
    assert(cred.sd_jwt.includes('~'),'SD-JWT must contain ~ separators')
    assert(cred.sd_jwt.split('.').length>=3,'Must have header.payload.sig')
    assertEqual(cred.issuer_did,'did:web:la-maison.org','issuer_did must match')
    assertEqual(cred.subject_did,holderDid,'subject_did must match')
    assertEqual(cred.type,CREDENTIAL_TYPE.MEMBERSHIP,'type must match')
    assert(!cred.revoked,'Must not be revoked initially')
  })

  await test('issueCredential — disclosures embedded in SD-JWT', async () => {
    const {cred}=await issueMembership(issuerKp,holderDid)
    const parts=cred.sd_jwt.split('~')
    // header.payload.sig + 3 disclosures (name, email, role)
    assertEqual(parts.length,4,'Must have 4 parts (jwt + 3 disclosures)')
  })

  await test('issueCredential — bound claims visible without disclosures', async () => {
    const {cred}=await issueMembership(issuerKp,holderDid)
    assertEqual(cred.bound_claims.node_id,'node-1','node_id must be visible')
    assertEqual(cred.bound_claims.memberOf,'La Maison du Soleil Levant','memberOf must be visible')
  })

  // ── 4. Parse credential ──────────────────────────────────────────────────
  log('\n── Parse credential ─────────────────────','sep')

  await test('parseCredential — extracts all fields', async () => {
    const {cred}=await issueMembership(issuerKp,holderDid)
    const parsed=parseCredential(cred.sd_jwt)
    assertEqual(parsed.issuer_did,'did:web:la-maison.org','issuer_did must parse')
    assertEqual(parsed.subject_did,holderDid,'subject_did must parse')
    assertEqual(parsed.type,CREDENTIAL_TYPE.MEMBERSHIP,'type must parse')
    assertEqual(parsed.disclosures.length,3,'3 disclosures must parse')
    assert(parsed.sd_hashes.length===3,'3 sd_hashes must parse')
  })

  await test('parseCredential — disclosures decoded correctly', async () => {
    const {cred}=await issueMembership(issuerKp,holderDid)
    const parsed=parseCredential(cred.sd_jwt)
    const nameDisc=parsed.disclosures.find(d=>d.key==='name')
    assert(nameDisc,'name disclosure must be present')
    assertEqual(nameDisc.value,'Eva Martin','name value must decode correctly')
  })

  // ── 5. Verify credential ─────────────────────────────────────────────────
  log('\n── Verify credential ────────────────────','sep')

  await test('verifyCredential — valid credential verifies', async () => {
    const {cred,issuerPubJwk}=await issueMembership(issuerKp,holderDid)
    const parsed=parseCredential(cred.sd_jwt)
    const result=await verifyCredential(parsed,issuerPubJwk)
    assert(result.valid,'Valid credential must verify')
    assertNull(result.reason,'No reason for valid credential')
  })

  await test('verifyCredential — wrong issuer key fails', async () => {
    const {cred}=await issueMembership(issuerKp,holderDid)
    const rogueJwk=await exportJwk(rogueKp.publicKey)
    const parsed=parseCredential(cred.sd_jwt)
    const result=await verifyCredential(parsed,rogueJwk)
    assert(!result.valid,'Wrong key must fail verification')
    assertEqual(result.reason,'SIGNATURE_INVALID','Reason must be SIGNATURE_INVALID')
  })

  await test('verifyCredential — tampered payload fails', async () => {
    const {cred,issuerPubJwk}=await issueMembership(issuerKp,holderDid)
    // Tamper with the payload portion of the SD-JWT
    const parts=cred.sd_jwt.split('~')
    const [h,p,s]=parts[0].split('.')
    // Modify payload
    const payload=decJSON(p)
    payload.sub='did:key:zHACKED'
    const tamperedP=encJSON(payload)
    const tamperedJwt=`${h}.${tamperedP}.${s}`
    const tamperedSdJwt=[tamperedJwt,...parts.slice(1)].join('~')
    const parsed=parseCredential(tamperedSdJwt)
    const result=await verifyCredential(parsed,issuerPubJwk)
    assert(!result.valid,'Tampered payload must fail')
    assertEqual(result.reason,'SIGNATURE_INVALID','Reason must be SIGNATURE_INVALID')
  })

  await test('verifyCredential — accepts CryptoKey directly', async () => {
    const {cred}=await issueMembership(issuerKp,holderDid)
    const parsed=parseCredential(cred.sd_jwt)
    const result=await verifyCredential(parsed,issuerKp.publicKey)
    assert(result.valid,'Must accept CryptoKey directly')
  })

  // ── 6. Build presentation ────────────────────────────────────────────────
  log('\n── Build presentation ───────────────────','sep')

  await test('buildPresentation — includes only chosen disclosures', async () => {
    const {cred}=await issueMembership(issuerKp,holderDid)
    const vp=await buildPresentation({
      credential:cred,revealKeys:['name'],
      holderDid,holderPrivateKey:holderKp.privateKey,
    })
    // SD-JWT in presentation should have only 1 disclosure (name), not 3
    const parts=vp.sd_jwt.split('~')
    assertEqual(parts.length,2,'JWT + 1 disclosure only')
    assertEqual(vp.revealed_claims.length,1,'1 revealed claim')
    assertEqual(vp.revealed_claims[0].key,'name','name must be revealed')
    assertEqual(vp.revealed_claims[0].value,'Eva Martin','value must be correct')
  })

  await test('buildPresentation — no disclosures is valid (minimum)', async () => {
    const {cred}=await issueMembership(issuerKp,holderDid)
    const vp=await buildPresentation({
      credential:cred,revealKeys:[],
      holderDid,holderPrivateKey:holderKp.privateKey,
    })
    const parts=vp.sd_jwt.split('~')
    assertEqual(parts.length,1,'JWT only, no disclosures')
    assertEqual(vp.revealed_claims.length,0,'No revealed claims')
  })

  await test('buildPresentation — nonce embedded in holder proof', async () => {
    const {cred}=await issueMembership(issuerKp,holderDid)
    const vp=await buildPresentation({
      credential:cred,revealKeys:['name'],
      holderDid,holderPrivateKey:holderKp.privateKey,
      nonce:'challenge-abc-123',
    })
    assertEqual(vp.holder_proof.payload.nonce,'challenge-abc-123','Nonce must be in proof')
  })

  await test('buildPresentation — reveals multiple fields', async () => {
    const {cred}=await issueMembership(issuerKp,holderDid)
    const vp=await buildPresentation({
      credential:cred,revealKeys:['name','email'],
      holderDid,holderPrivateKey:holderKp.privateKey,
    })
    assertEqual(vp.revealed_claims.length,2,'2 claims must be revealed')
    const keys=vp.revealed_claims.map(c=>c.key)
    assert(keys.includes('name'),'name must be revealed')
    assert(keys.includes('email'),'email must be revealed')
    assert(!keys.includes('role'),'role must NOT be revealed')
  })

  // ── 7. Verify presentation ───────────────────────────────────────────────
  log('\n── Verify presentation ──────────────────','sep')

  await test('verifyPresentation — full valid chain succeeds', async () => {
    const {cred,issuerPubJwk}=await issueMembership(issuerKp,holderDid)
    const vp=await buildPresentation({
      credential:cred,revealKeys:['name','email'],
      holderDid,holderPrivateKey:holderKp.privateKey,
      nonce:'nonce-xyz',
    })
    const result=await verifyPresentation({
      presentation:vp,
      issuerPublicKey:issuerPubJwk,
      holderPublicKey:holderPubJwk,
      expectedNonce:'nonce-xyz',
    })
    assert(result.valid,'Full valid chain must verify')
    assert(result.issuerValid,'Issuer sig must be valid')
    assert(result.holderValid,'Holder proof must be valid')
    assert(result.disclosuresValid,'Disclosures must be valid')
    assert(result.nonceValid,'Nonce must be valid')
    assertEqual(result.revealedClaims.name,'Eva Martin','name must be in revealed claims')
    assertEqual(result.revealedClaims.email,'eva@maison.org','email must be in revealed claims')
    assert(!('role' in result.revealedClaims),'role must NOT be revealed')
  })

  await test('verifyPresentation — wrong issuer key fails', async () => {
    const {cred}=await issueMembership(issuerKp,holderDid)
    const vp=await buildPresentation({
      credential:cred,revealKeys:['name'],
      holderDid,holderPrivateKey:holderKp.privateKey,
    })
    const rogueJwk=await exportJwk(rogueKp.publicKey)
    const result=await verifyPresentation({
      presentation:vp,issuerPublicKey:rogueJwk,holderPublicKey:holderPubJwk,
    })
    assert(!result.valid,'Wrong issuer key must fail')
    assert(result.reason.includes('ISSUER'),'Reason must mention ISSUER')
  })

  await test('verifyPresentation — wrong holder key fails', async () => {
    const {cred,issuerPubJwk}=await issueMembership(issuerKp,holderDid)
    const vp=await buildPresentation({
      credential:cred,revealKeys:['name'],
      holderDid,holderPrivateKey:holderKp.privateKey,
    })
    const rogueJwk=await exportJwk(rogueKp.publicKey)
    const result=await verifyPresentation({
      presentation:vp,issuerPublicKey:issuerPubJwk,holderPublicKey:rogueJwk,
    })
    assert(!result.valid,'Wrong holder key must fail')
    assertEqual(result.reason,'HOLDER_PROOF_INVALID','Reason must be HOLDER_PROOF_INVALID')
  })

  await test('verifyPresentation — nonce mismatch fails', async () => {
    const {cred,issuerPubJwk}=await issueMembership(issuerKp,holderDid)
    const vp=await buildPresentation({
      credential:cred,revealKeys:['name'],
      holderDid,holderPrivateKey:holderKp.privateKey,
      nonce:'correct-nonce',
    })
    const result=await verifyPresentation({
      presentation:vp,issuerPublicKey:issuerPubJwk,holderPublicKey:holderPubJwk,
      expectedNonce:'wrong-nonce',
    })
    assert(!result.valid,'Wrong nonce must fail')
    assertEqual(result.reason,'NONCE_MISMATCH','Reason must be NONCE_MISMATCH')
  })

  await test('verifyPresentation — expired credential fails', async () => {
    const pastDate=new Date(Date.now()-86_400_000).toISOString()
    const {cred,issuerPubJwk}=await issueMembership(issuerKp,holderDid,{expiresAt:pastDate})
    const vp=await buildPresentation({
      credential:cred,revealKeys:[],
      holderDid,holderPrivateKey:holderKp.privateKey,
    })
    const result=await verifyPresentation({
      presentation:vp,issuerPublicKey:issuerPubJwk,holderPublicKey:holderPubJwk,
    })
    assert(!result.valid,'Expired credential must fail')
    assertEqual(result.reason,'CREDENTIAL_EXPIRED','Reason must be CREDENTIAL_EXPIRED')
  })

  await test('verifyPresentation — subject mismatch fails (stolen credential)', async () => {
    const {cred,issuerPubJwk}=await issueMembership(issuerKp,holderDid)
    // Mallory tries to present Eva's credential as if she were the holder
    const malloryDid='did:key:zMallory'
    const vp=await buildPresentation({
      credential:cred,revealKeys:['name'],
      holderDid:malloryDid,        // Mallory claims to be the holder
      holderPrivateKey:rogueKp.privateKey,
    })
    const rogueJwk=await exportJwk(rogueKp.publicKey)
    const result=await verifyPresentation({
      presentation:vp,issuerPublicKey:issuerPubJwk,
      holderPublicKey:rogueJwk,   // Mallory's real key
    })
    assert(!result.valid,'Stolen credential must fail')
    assertEqual(result.reason,'SUBJECT_MISMATCH','Reason must be SUBJECT_MISMATCH')
  })

  // ── 8. Credential validity ───────────────────────────────────────────────
  log('\n── Credential validity ──────────────────','sep')

  await test('isCredentialValid — valid credential returns true', async () => {
    const {cred}=await issueMembership(issuerKp,holderDid)
    const result=isCredentialValid(cred)
    assert(result.valid,'Non-expired non-revoked must be valid')
    assertNull(result.reason,'No reason for valid credential')
  })

  await test('isCredentialValid — revoked credential returns false', async () => {
    const {cred}=await issueMembership(issuerKp,holderDid)
    const revoked=revokeCredential(cred)
    const result=isCredentialValid(revoked)
    assert(!result.valid,'Revoked must be invalid')
    assertEqual(result.reason,'REVOKED','Reason must be REVOKED')
    assert(revoked.revoked_at,'revoked_at must be set')
  })

  await test('isCredentialValid — expired credential returns false', async () => {
    const past=new Date(Date.now()-1000).toISOString()
    const {cred}=await issueMembership(issuerKp,holderDid,{expiresAt:past})
    const result=isCredentialValid(cred)
    assert(!result.valid,'Expired must be invalid')
    assertEqual(result.reason,'EXPIRED','Reason must be EXPIRED')
  })

  await test('isCredentialValid — no expiry is always valid', async () => {
    const {cred}=await issueMembership(issuerKp,holderDid)
    const result=isCredentialValid({...cred,expires_at:null})
    assert(result.valid,'No expiry must be valid')
  })

  // ── 9. Vault store helpers ───────────────────────────────────────────────
  log('\n── Vault store helpers ──────────────────','sep')

  await test('getCredentials — filter by type', async () => {
    const {cred:c1}=await issueMembership(issuerKp,holderDid)
    const vault={credentials:[
      c1,
      {...c1,id:'cred-2',type:CREDENTIAL_TYPE.REFERRAL},
      {...c1,id:'cred-3',type:CREDENTIAL_TYPE.MEMBERSHIP},
    ]}
    const membership=getCredentials(vault,CREDENTIAL_TYPE.MEMBERSHIP)
    assertEqual(membership.length,2,'Must return 2 membership credentials')
    const all=getCredentials(vault)
    assertEqual(all.length,3,'Must return all 3 without filter')
  })

  await test('getCredentialById — finds correct credential', async () => {
    const {cred}=await issueMembership(issuerKp,holderDid)
    const vault={credentials:[cred,{...cred,id:'other-id'}]}
    const found=getCredentialById(vault,cred.id)
    assertEqual(found.id,cred.id,'Must find correct credential')
    assertNull(getCredentialById(vault,'nonexistent'),'Must return null for missing ID')
  })

  await test('getValidCredentials — excludes revoked and expired', async () => {
    const {cred}=await issueMembership(issuerKp,holderDid)
    const past=new Date(Date.now()-1000).toISOString()
    const vault={credentials:[
      cred,                                                    // valid
      {...cred,id:'c2',revoked:true},                          // revoked
      {...cred,id:'c3',expires_at:past},                       // expired
    ]}
    const valid=getValidCredentials(vault)
    assertEqual(valid.length,1,'Only 1 valid credential')
    assertEqual(valid[0].id,cred.id,'Must be the non-expired non-revoked one')
  })

  await test('resolveDisclosureRequest — finds matching credential', async () => {
    const {cred}=await issueMembership(issuerKp,holderDid)
    const vault={credentials:[cred]}
    const result=resolveDisclosureRequest(vault,{
      type:CREDENTIAL_TYPE.MEMBERSHIP,
      requiredClaims:['node_id','name'],  // node_id is bound, name is selective
    })
    assert(result.canSatisfy,'Must be able to satisfy request')
    assertEqual(result.credential.id,cred.id,'Must return matching credential')
    assert(result.available.includes('name'),'name must be in available claims')
    assert(result.available.includes('node_id'),'node_id must be in available claims')
  })

  await test('resolveDisclosureRequest — fails for unavailable claims', async () => {
    const {cred}=await issueMembership(issuerKp,holderDid)
    const vault={credentials:[cred]}
    const result=resolveDisclosureRequest(vault,{
      type:CREDENTIAL_TYPE.MEMBERSHIP,
      requiredClaims:['birthdate'],  // not in this credential
    })
    assert(!result.canSatisfy,'Must not satisfy request for missing claim')
  })

  await test('resolveDisclosureRequest — returns null for missing type', async () => {
    const vault={credentials:[]}
    const result=resolveDisclosureRequest(vault,{type:CREDENTIAL_TYPE.MEMBERSHIP,requiredClaims:[]})
    assertNull(result.credential,'Must return null credential for empty vault')
    assert(!result.canSatisfy,'Cannot satisfy with empty vault')
  })

  // ── Summary ────────────────────────────────────────────────────────────────
  log(`\n${'─'.repeat(44)}`,'sep')
  log(`  ${passed} passed    ${failed} failed`,failed===0?'pass':'fail')
  summary.className=failed===0?'all-pass':'has-fail'
  summary.textContent=failed===0
    ? '🎉  All tests passed. Credentials layer is solid. Ready for UI.'
    : `⚠️  ${failed} test(s) failed. Review before proceeding.`
}
</script>
